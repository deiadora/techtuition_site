# Netlify site configuration.
# This file must sit at the top level of your project, next to techtuition.html.

[build]
  publish = "."
  functions = "netlify/functions"

# Lets the page keep calling /api/contact (as it already does) while Netlify
# quietly routes that to the actual function at /.netlify/functions/contact.
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200